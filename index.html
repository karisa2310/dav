<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Boyfriend ♡</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Georgia, serif;
  background: linear-gradient(160deg, #d9efff, #b9d9f2, #e8f5ff);
  color: #52727d;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* hiasan kecil */
.sparkle {
  position: fixed;
  color: white;
  font-size: 22px;
  opacity: 0.8;
  animation: float 4s infinite ease-in-out;
}

.s1 {
  top: 12%;
  left: 12%;
}

.s2 {
  top: 20%;
  right: 15%;
  animation-delay: 1s;
}

.s3 {
  bottom: 18%;
  left: 18%;
  animation-delay: 2s;
}

.s4 {
  bottom: 12%;
  right: 13%;
  animation-delay: 3s;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-12px);
  }
}

/* kotak utama */
.card {
  width: 88%;
  max-width: 380px;
  padding: 25px;
  text-align: center;
  background: rgba(255,255,255,0.65);
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(80,120,150,0.2);
  backdrop-filter: blur(8px);
}

h1 {
  font-size: 27px;
  margin-bottom: 18px;
  color: #52727d;
}

.photo {
  width: 100%;
  max-height: 390px;
  object-fit: cover;
  border-radius: 20px;
  display: block;
  box-shadow: 0 8px 20px rgba(70,100,120,0.2);
}

p {
  margin-top: 18px;
  font-size: 16px;
  line-height: 1.6;
}

.heart {
  color: #83aebe;
  font-size: 22px;
}
</style>
</head>

<body>

<div class="sparkle s1">✦</div>
<div class="sparkle s2">♡</div>
<div class="sparkle s3">✧</div>
<div class="sparkle s4">♡</div>

<div class="card">

  <h1>For My Boyfriend ♡</h1>

  <img src="pacar.jpg" class="photo">

  <p>
    A little place for someone special
    <span class="heart">♡</span>
  </p>

</div>

</body>
</html>
